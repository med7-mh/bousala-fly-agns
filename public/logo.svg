<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />

  <!-- Compass Star (4 Points) -->
  <g filter="url(#shadow)">
    <!-- North/South -->
    <path d="M256 70 L280 230 L256 390 L232 230 Z" fill="url(#gold)" />
    <!-- East/West -->
    <path d="M100 256 L230 232 L412 256 L230 280 Z" fill="url(#gold)" opacity="0.8" />
    
    <!-- 3D effect / Highlight -->
    <path d="M256 70 L280 230 L256 256 Z" fill="#fef3c7" opacity="0.6" />
    <path d="M412 256 L230 232 L256 256 Z" fill="#fef3c7" opacity="0.4" />
  </g>

  <!-- Inner Center -->
  <circle cx="256" cy="256" r="28" fill="#1e293b" stroke="#fcd34d" stroke-width="6" />
  <circle cx="256" cy="256" r="10" fill="#fef3c7" />
  
  <!-- N E S W Markers -->
  <text x="256" y="55" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">N</text>
  <text x="256" y="465" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">S</text>
  <text x="465" y="256" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">E</text>
  <text x="45" y="256" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">W</text>
</svg>
